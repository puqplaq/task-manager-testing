name: Push/Commit CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Linting and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: make install

      - name: Run Linter (ruff + mypy)
        run: make lint

      - name: Run Formatter check
        run: poetry run ruff format --check app/ tests/

      - name: Run Tests
        run: make test
